name: Daily Market Briefing

on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance flask feedparser requests

      - name: Generate briefing data
        run: python3 briefing.py

      - name: Commit and push data
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add data/
          git diff --staged --quiet || git commit -m 'Daily market briefing data'
          git push

      - name: Trigger notifications on web app
        run: |
          curl -X POST "${{ secrets.WEB_APP_URL }}/trigger" \
            -H "X-Trigger-Secret: ${{ secrets.TRIGGER_SECRET }}"
